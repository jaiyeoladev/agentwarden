[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwarden"
version = "1.0.0"
description = "AI agent and non-human identity governance for Microsoft Entra ID, with ML anomaly detection for over-privileged service principals."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Olatunji Kayode Jaiyeola" }]
requires-python = ">=3.11"
keywords = ["entra-id", "ai-agents", "non-human-identity", "service-principals", "anomaly-detection", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agentwarden = "agentwarden.core.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["agentwarden", "agentwarden.*"]

[tool.setuptools.package-data]
"agentwarden" = ["templates/*.html"]
"agentwarden.core" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "B023", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentwarden"]
